apiVersion: v1
kind: Namespace
metadata:
  name: dex
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: dex
data:
  config.yaml: |
    issuer: https://host.docker.internal:5556/dex
    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db
    web:
      https: 0.0.0.0:5556
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
    telemetry:
      http: 0.0.0.0:5558
    logger:
      level: info
      format: text
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
    enablePasswordDB: true
    staticPasswords:
      - email: admin@keks.local
        # bcrypt cost 10 of "password" (Dex requires cost >= 10)
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: admin
        userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
    staticClients:
      - id: keks-panel
        redirectURIs:
          - http://localhost:5173/auth/callback
          - http://localhost:5173/api/auth/callback
          - http://127.0.0.1:5173/auth/callback
          - http://127.0.0.1:5173/api/auth/callback
          - http://localhost:8080/api/auth/callback
        name: KEKS Panel
        secret: keks-panel-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
  labels:
    app: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      initContainers:
        - name: init-data
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /var/dex && chmod 777 /var/dex']
          volumeMounts:
            - name: data
              mountPath: /var/dex
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args:
            - dex
            - serve
            - /etc/dex/config.yaml
          ports:
            - name: https
              containerPort: 5556
            - name: telemetry
              containerPort: 5558
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tls
              mountPath: /etc/dex/tls
              readOnly: true
            - name: data
              mountPath: /var/dex
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: dex
        - name: tls
          secret:
            secretName: dex-tls
        - name: data
          hostPath:
            path: /var/lib/keks-dex
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: dex
  labels:
    app: dex
spec:
  type: NodePort
  selector:
    app: dex
  ports:
    - name: https
      port: 5556
      targetPort: https
      nodePort: 32056
      protocol: TCP
