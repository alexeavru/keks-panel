kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: keks
nodes:
  - role: control-plane
    image: kindest/node:v1.30.13
    extraPortMappings:
      - containerPort: 32056
        hostPort: 5556
        protocol: TCP
    extraMounts:
      - hostPath: ./deploy/tls
        containerPath: /etc/keks-oidc
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            oidc-issuer-url: https://host.docker.internal:5556/dex
            oidc-client-id: keks-panel
            oidc-username-claim: email
            oidc-groups-claim: groups
            oidc-username-prefix: "-"
            oidc-groups-prefix: "-"
            oidc-ca-file: /etc/keks-oidc/ca.crt
          extraVolumes:
            - name: oidc-ca
              hostPath: /etc/keks-oidc
              mountPath: /etc/keks-oidc
              readOnly: true
              pathType: Directory
